<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Tonibung Project Overview</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    
        .mapboxgl-ctrl-scale {
            font-size: 15px; 
            padding: 8px; 
        }

        .mapboxgl-ctrl-group button {
            width: 42px; 
            height: 42px; 
        }

        .mapboxgl-popup {
            max-width: 400px;
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
        }

        .map-overlay {
            font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
            background-color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            position: absolute;
            width: 25%;
            top: 10px;
            left: 80%;
            padding: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>

    // use token w special URL access 
    mapboxgl.accessToken = 'pk.eyJ1IjoibGl6bWNjbGVhcnkiLCJhIjoiY21wejd6ZXdtMDI4ejJwcGc2eHBjYnRldyJ9.eZNRdnY3-0iPTqFkzSModg';

    // initalize the map 
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/light-v11',
        zoom: 5.5,
        pitch: 0,
        bearing: 0,
        center: [109.53822787545187, 4.870270267301068]
    });

    map.addControl(new mapboxgl.NavigationControl());
    map.addControl(new mapboxgl.ScaleControl());
    map.addControl(new mapboxgl.FullscreenControl());


    // actions when map loads 
    map.on('style.load', () => {

        // add projects source
        map.addSource('projects_source', {
            type: 'geojson',
            data: 'https://raw.githubusercontent.com/tonibungcreate/project_map/main/project_list.geojson'
        });

        // create invisible layer around points 
        map.addLayer({
            id: 'Projects-hitbox',
            type: 'circle',
            source: 'projects_source',
            layout: { visibility: 'visible' },
            paint: {
                'circle-color': 'transparent',
                'circle-radius': 20,
                'circle-opacity': 0.001
            }
        });

        // point style
        map.addLayer({
            id: 'Projects',
            type: 'circle',
            source: 'projects_source',
            layout: { visibility: 'visible' },
            paint: {
                'circle-color': '#2E6F40',
                'circle-radius': 7,
                'circle-stroke-width': 1.5,
                'circle-stroke-color': '#fff',
                'circle-opacity': 0.85
            }
        });

        // popup on click
        map.on('click', 'Projects-hitbox', (e) => {
            const coordinates = e.lngLat;
            const p = e.features[0].properties;

            new mapboxgl.Popup()
                .setLngLat(coordinates)
                .setHTML(`
                    <strong>Project Name:</strong> ${p.PROJECT ?? '—'}<br>
                    <strong>Project Type:</strong> ${p.TYPE ?? '—'}<br>
                    <strong>Capacity (KW):</strong> ${p.CAPACITY ?? '—'}<br>
                    <strong>Households:</strong> ${p.HOUSEHOLD ?? '—'}<br>
                    <strong>Start Date:</strong> ${p.START ?? '—'}<br>
                    <strong>End Date:</strong> ${p.COMPLETED ?? '—'}<br>
                    <strong>Progress:</strong> ${p.PROGRESS ?? '—'}
                `)
                .addTo(map);
        });

        // change cursor
        map.on('mouseenter', 'Projects-hitbox', () => {
            map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'Projects-hitbox', () => {
            map.getCanvas().style.cursor = '';
        });
    });

    </script>
</body>
</html>
