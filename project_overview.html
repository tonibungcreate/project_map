<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Tonibung Project Overview</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.24.0/mapbox-gl.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }


        #map {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    
        .mapboxgl-ctrl-scale {
            font-size: 15px; 
            padding: 8px; 
        }

        .mapboxgl-ctrl-group button {
            width: 42px; 
            height: 42px; 
        }

        .mapboxgl-popup {
            max-width: 400px;
            font:
                12px/20px 'Helvetica Neue',
                Arial,
                Helvetica,
                sans-serif;
        }

        .map-overlay {
            font:
                12px/20px 'Helvetica Neue',
                Arial,
                Helvetica,
                sans-serif;
            background-color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            border-radius: 3px;
            position: absolute;
            width: 25%;
            top: 10px;
            left: 80%;
            padding: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
////// map ////////////////////////////////////////////////////
        mapboxgl.accessToken = 'pk.eyJ1IjoibGl6bWNjbGVhcnkiLCJhIjoiY203dXJvbG8zMDQxcTJqb2RobWJrb29rZiJ9.EXEp4Zxzb90S3p3977Pnfw';
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/lizmccleary/cmej46qal00h801ss6vsj3ar5',
        zoom: 5,
        pitch: 0,
        bearing: 0,
        center: [107.631027, 5.229121]
    });
        
        // add Find My Location to map 
        map.addControl(new mapboxgl.NavigationControl());

        // Add a scale control to the map
        map.addControl(new mapboxgl.ScaleControl());

        // Add fullscreen button
        map.addControl(new mapboxgl.FullscreenControl());

        // adding 3d terrain
        map.on('style.load', () => {
            map.addSource('mapbox-dem', {
                'type': 'raster-dem',
                'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
                'tileSize': 512,
                'maxzoom': 14
            });
            // add the DEM source as a terrain layer with exaggerated height
            map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });
        }); 

//// Start to add layers to build pop-ups and functions off of. ////
map.on('load', () => {

    const canvas = map.getCanvasContainer();

    // Add the project point layer
    map.addSource('projects_source', {
        type: 'geojson',
        data: 'project_list.geojson'
    });
    map.addLayer({
        id: 'Projects',
        type: 'circle',
        source: 'projects_source',
        layout: { 'visibility': 'visible' },
        paint: {
            'circle-color': '#AFFF00',
            'circle-radius': 5,
            'circle-stroke-width': .3,
            'circle-stroke-color': '#fff',
            'circle-opacity': 0.75
        }
    });

    // popup 
    map.on('click', 'Projects', (e) => {
        const coordinates = e.lngLat;
        const properties = e.features[0].properties;

        new mapboxgl.Popup()
            .setLngLat(coordinates)
            .setHTML(`
                <strong>Project Name:</strong> ${properties.PROJECT}<br>
                <strong>Project Type:</strong> ${properties.TYPE}<br>
                <strong>Capacity (KW):</strong> ${properties.CAPACITY}<br>
                <strong>Households:</strong> ${properties.HOUSEHOLD}<br>
                <strong>Start Date:</strong> ${properties.START}<br>
                <strong>End Date:</strong> ${properties.COMPLETED}<br>
                <strong>Progress:</strong> ${properties.PROGRESS}
            `)
            .addTo(map);
    });

    map.on('mouseenter', 'Projects', () => {
        map.getCanvas().style.cursor = 'pointer';
    });

    map.on('mouseleave', 'Projects', () => {
        map.getCanvas().style.cursor = ''; 
    });
});
    </script>
        
</body>

</html>
